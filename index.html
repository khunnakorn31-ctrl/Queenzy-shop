<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queenzy Shop</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 90%;
        }
        h1 {
            color: #ffc107;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #ccc;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #ffc107;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Queenzy Shop</h1>
        <p>ยินดีต้อนรับสู่ร้านค้า</p>
        <a href="https://www.facebook.com/share/1QvzdSqQY7/" target="_blank" class="btn">ติดต่อสอบถาม</a>
    </div>

</body>
</html>
